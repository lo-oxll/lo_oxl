<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>علي كامل | Ali Kamil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --ink: #12181f;
      --ink-soft: #2a323c;
      --paper: #f7f4ec;
      --paper-deep: #eee8d8;
      --gold: #ad8a4e;
      --gold-light: #c9ab72;
      --gold-dim: rgba(173, 138, 78, 0.35);
      --slate: #5a6270;
      --rule: #ddd3ba;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(173, 138, 78, 0.08), transparent 40%),
        radial-gradient(circle at 85% 90%, rgba(173, 138, 78, 0.06), transparent 45%),
        var(--ink);
      color: var(--slate);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 18px;
    }

    /* ambient vertical rule pattern, evokes ledger paper */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 63px,
        rgba(255, 255, 255, 0.02) 64px
      );
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      background: var(--paper);
      border-radius: 4px;
      box-shadow:
        0 40px 80px -20px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(173, 138, 78, 0.15);
      overflow: hidden;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .card__band {
      height: 6px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
    }

    .card__inner {
      padding: 46px 40px 36px;
      text-align: center;
    }

    /* Monogram seal */
    .seal {
      width: 104px;
      height: 104px;
      margin: 0 auto 22px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seal img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--paper);
      box-shadow: 0 0 0 2px var(--gold), 0 12px 28px rgba(0,0,0,0.18);
    }

    .seal::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed var(--gold-dim);
    }

    h1 {
      font-family: 'Amiri', serif;
      font-weight: 700;
      font-size: 30px;
      color: var(--ink);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .name-en {
      font-family: 'Cairo', sans-serif;
      font-size: 12.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 22px;
    }

    .rule {
      width: 56px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 22px;
      border-radius: 2px;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 22px;
      border: 1px solid var(--gold);
      color: var(--ink);
      font-weight: 600;
      font-size: 14.5px;
      border-radius: 30px;
      margin-bottom: 26px;
      background: linear-gradient(180deg, rgba(173,138,78,0.08), transparent);
    }

    .role-badge i { color: var(--gold); font-size: 13px; }

    .credentials {
      list-style: none;
      text-align: right;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-bottom: 30px;
    }

    .credentials li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 4px;
      font-size: 14.5px;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .credentials li + li {
      border-top: 1px dashed var(--rule);
    }

    .credentials i {
      color: var(--gold);
      font-size: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      width: 16px;
      text-align: center;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 18px;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      --brand: var(--ink);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 18px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: #fff;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 14.5px;
      transition: border-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
      text-align: right;
    }

    .btn .icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
      flex-shrink: 0;
    }

    .btn:hover {
      border-color: var(--gold);
      transform: translateX(-2px);
      box-shadow: 0 8px 18px -8px rgba(173, 138, 78, 0.5);
    }

    .instagram .icon { background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .facebook  .icon { background: #3b5998; }
    .linkedin  .icon { background: #0077b5; }
    .telegram  .icon { background: #0088cc; }
    .discord   .icon { background: #5865f2; }
    .twitch    .icon { background: #6441a5; }
    .threads   .icon { background: #111; }
    .x         .icon { background: #000; }
    .github    .icon { background: #24292e; }
    .tiktok    .icon { background: #000; }
    .youtube   .icon { background: #d5302f; }
    .pinterest .icon { background: #bd081c; }

    .card__footer {
      margin-top: 30px;
      padding-top: 18px;
      border-top: 1px solid var(--rule);
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #9a9280;
      direction: ltr;
    }

    @media (max-width: 480px) {
      .card__inner { padding: 38px 24px 28px; }
      h1 { font-size: 26px; }
      .seal { width: 90px; height: 90px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; opacity: 1; transform: none; }
      .btn:hover { transform: none; }
    }
  </style>
</head>
